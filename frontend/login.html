<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIDII - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="auth-page">
    <main class="login-container">
        <header class="login-brand">
            <p>Sistema Integral de Información Institucional</p>
        </header>

        <form id="loginForm" class="card-login" method="post">
            <h1>Iniciar sesión</h1>
            <p class="form-intro">Accede con tu cuenta institucional.</p>

            <div class="input-group">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" required autocomplete="username" placeholder="usuario@utpuebla.edu.mx">
            </div>

            <div class="input-group password-group">
                <label for="password">Contraseña</label>
                <div class="password-control">
                    <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Contraseña">
                    <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar contraseña" aria-pressed="false">Mostrar</button>
                </div>
            </div>

            <p class="form-message" id="loginMessage" role="alert" hidden></p>
            <button type="submit" class="btn-login">Ingresar</button>
            <a class="register-link" id="registerLink" href="register.html" hidden>Crear SUPER ADMIN</a>
        </form>
    </main>

    <script src="js/api-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
    <script src="js/footer.js"></script>
    
</body>
</html>
