<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>SIDII - Registro</title>
	<link rel="stylesheet" href="css/global.css">
	<link rel="stylesheet" href="css/login.css">
</head>
<body class="auth-page">
	<main class="login-container">
		<header class="login-brand">
			<p>Sistema Integral de Información Institucional</p>
		</header>
		<section class="card-login">
			<h1>Crear cuenta</h1>
			<p class="form-intro">El primer registro se convierte en SUPER ADMIN.</p>
			<form id="registerForm" class="auth-form" method="post">
				<div class="input-group">
					<label for="registerName">Nombre</label>
					<input id="registerName" name="name" type="text" autocomplete="name" required>
				</div>
				<div class="input-group">
					<label for="registerEmail">Correo electrónico</label>
					<input id="registerEmail" name="email" type="email" autocomplete="email" required>
				</div>
				<div class="input-group">
					<label for="registerPassword">Contraseña</label>
					<div class="password-control">
						<input id="registerPassword" name="password" type="password" autocomplete="new-password" required>
						<button type="button" class="toggle-password" data-toggle-password="registerPassword" aria-label="Mostrar contraseña" aria-pressed="false">Mostrar</button>
					</div>
				</div>
				<p class="form-message" id="registerMessage" role="alert" hidden></p>
				<button class="btn-login" type="submit">Registrar</button>
			</form>
			<a class="register-link" href="login.html">Volver al inicio de sesión</a>
		</section>
	</main>
	<script src="js/api-config.js"></script>
	<script src="js/auth.js"></script>
	<script src="js/footer.js"></script>
</body>
</html>
